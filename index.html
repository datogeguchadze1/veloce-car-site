<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VELOCE Garage — Mercedes-Benz 3D კატალოგი</title>
<meta name="description" content="Mercedes-Benz-ის ისტორიული მოდელების 3D კატალოგი: დაათვალიერე, გააღე კარები, შეიხედე სალონში და დაატიუნინგე.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/controls/OrbitControls.js": "./vendor/three/OrbitControls.js",
  "three/addons/environments/RoomEnvironment.js": "./vendor/three/RoomEnvironment.js",
  "three/addons/utils/BufferGeometryUtils.js": "./vendor/three/BufferGeometryUtils.js"
} }
</script>
</head>
<body>
<header class="top">
  <a class="logo" href="#">VELOCE<b>.</b><span>Garage</span></a>
  <p class="sub">Mercedes-Benz · 3D კატალოგი</p>
</header>

<main class="layout">
  <aside class="catalog" aria-label="მოდელების კატალოგი">
    <div class="eras" id="eras" role="tablist"></div>
    <ol class="timeline" id="list"></ol>
  </aside>

  <section class="viewer">
    <div class="stage" id="stage">
      <canvas id="c" aria-label="3D მანქანის ხედი"></canvas>
      <div class="title-ov">
        <small id="ovYear"></small>
        <h1 id="ovName"></h1>
        <span id="ovChassis"></span>
      </div>
      <div class="loading" id="loading">იტვირთება…</div>
      <p class="help" id="help">გადაატარე / გადაათრიე მოსატრიალებლად · ბორბალი ან ორი თითი — ზუმი</p>
    </div>
    <div class="controls" id="controls">
      <button data-act="doors" aria-pressed="false"><i>🚪</i>კარები</button>
      <button data-act="hood" aria-pressed="false"><i>🔧</i>კაპოტი</button>
      <button data-act="trunk" aria-pressed="false"><i>🧳</i>საბარგული</button>
      <button data-act="inside" aria-pressed="false"><i>👁</i>სალონი</button>
      <button data-act="spin" aria-pressed="false"><i>⟳</i>ბრუნვა</button>
      <button data-act="shot"><i>📷</i>სურათი</button>
      <button data-act="drive" disabled title="მალე დაემატება"><i>🏁</i>ტესტ-დრაივი<em>მალე</em></button>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="on" data-tab="info" role="tab">ინფო</button>
      <button data-tab="tune" role="tab">ტუნინგი</button>
    </div>
    <div class="tab on" id="tab-info"></div>
    <div class="tab" id="tab-tune"></div>
  </aside>
</main>

<footer class="foot">
  არაოფიციალური სასწავლო პროექტი. არ არის დაკავშირებული Mercedes-Benz Group AG-თან.
  3D მოდელები სტილიზებულია, ტექნიკური მონაცემები მიახლოებითია.
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
